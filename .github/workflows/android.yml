# Builds and tests the Android app (android/). The debug APK is kept as an
# artifact, so it can be downloaded and installed on a phone for testing.
name: Android

on:
  push:
    paths:
      - "android/**"
      - "crates/dsp206-proto/src/command.rs"
      - "claude/docs/protocol.md"
      - "claude/rules/device-safety.md"
      - "tools/re/captures/**"
      - ".github/workflows/android.yml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android platform 37
        # The runner image already has the SDK licences accepted.
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;36.0.0" > /dev/null'
      - name: Test, lint and build
        run: ./gradlew --console=plain :core:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            android/app/build/reports/
            android/app/build/screenshots/
            android/core/build/reports/
      - uses: actions/upload-artifact@v4
        with:
          name: meredsp206-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
