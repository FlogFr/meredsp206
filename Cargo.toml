[workspace]
resolver = "2"
members = ["crates/dsp206-proto"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"

[profile.release]
lto = true
codegen-units = 1
strip = true
