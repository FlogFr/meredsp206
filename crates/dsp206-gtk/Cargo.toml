[package]
name = "dsp206-gtk"
description = "meredsp206: GTK 4 / libadwaita editor for the t.racks DSP 206"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "meredsp206"
path = "src/main.rs"

[dependencies]
dsp206-proto = { path = "../dsp206-proto" }
dsp206-link = { path = "../dsp206-link" }
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_6"] }

[lints]
workspace = true
